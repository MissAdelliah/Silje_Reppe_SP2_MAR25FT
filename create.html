<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Create a new auction listing on Second Story."
    />

    <title>Create Listing | Second Story</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zalando+Sans+Expanded:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="flex min-h-dvh flex-col bg-page text-ink">
    <header id="site-header" data-header-variant="full"></header>

    <main class="flex-1">
      <!-- Login required -->
      <section
        id="create-guest"
        hidden
        class="mx-auto flex min-h-[420px] max-w-md items-center justify-center px-6 text-center"
      >
        <div>
          <h1 class="font-display text-xl font-medium">
            Log in to create a listing
          </h1>

          <a
            href="./auth.html?mode=login"
            class="mt-6 inline-flex min-h-11 items-center justify-center rounded-lg bg-ink px-6 text-sm font-medium text-white"
          >
            Log in
          </a>
        </div>
      </section>

      <!-- Create -->
      <section
        id="create-view"
        class="mx-auto w-full max-w-[430px] px-[15px] pb-14 pt-3 lg:max-w-[960px] lg:px-0 lg:pb-24 lg:pt-12"
        aria-labelledby="create-title"
      >
        <div
          class="relative mb-6 flex min-h-11 items-center justify-center lg:mb-12 lg:justify-start"
        >
          <a
            href="./index.html"
            class="absolute left-0 flex size-11 items-center justify-center lg:static lg:mr-14"
            aria-label="Back"
          >
            <span
              class="material-symbols-outlined text-[20px]"
              aria-hidden="true"
            >
              arrow_back
            </span>
          </a>

          <h1 id="create-title" class="text-[16px] font-medium lg:text-sm">
            Create Listing
          </h1>
        </div>

        <form
          id="create-listing-form"
          novalidate
          class="lg:grid lg:grid-cols-[480px_1fr] lg:gap-x-[50px]"
        >
          <!-- Media -->
          <section
            class="lg:sticky lg:top-[120px] lg:self-start"
            aria-labelledby="photos-heading"
          >
            <h2
              id="photos-heading"
              class="mb-2 text-sm font-medium lg:text-xs lg:text-muted"
            >
              Photos
              <span id="media-count">(0)</span>
            </h2>

            <div
              class="relative aspect-square w-full overflow-hidden rounded-xl bg-soft lg:h-[480px] lg:rounded-none"
            >
              <div
                id="media-placeholder"
                class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-muted"
              >
                <span
                  class="material-symbols-outlined text-[38px]"
                  aria-hidden="true"
                >
                  add_photo_alternate
                </span>

                <span class="text-sm"> Add an image URL </span>
              </div>

              <img
                id="media-main-preview"
                src=""
                alt=""
                hidden
                class="relative h-full w-full object-cover"
              />
            </div>

            <div
              id="media-thumbnails"
              class="mt-3 flex gap-3 overflow-x-auto pb-1"
              aria-label="Listing images"
            ></div>

            <div class="mt-3 flex gap-2">
              <input
                id="media-url"
                type="url"
                inputmode="url"
                placeholder="Paste image URL..."
                aria-describedby="media-error"
                class="min-h-11 min-w-0 flex-1 rounded-lg border border-divider bg-white px-3 text-sm outline-none focus:border-ink"
              />

              <button
                id="add-media"
                type="button"
                class="min-h-11 shrink-0 rounded-lg bg-ink px-5 text-sm font-medium text-white"
              >
                Add
              </button>
            </div>

            <p
              id="media-error"
              hidden
              class="mt-2 text-xs text-brand"
              role="alert"
            ></p>
          </section>

          <!-- Form fields -->
          <section class="mt-8 lg:mt-0">
            <div>
              <label for="listing-title" class="block text-sm font-medium">
                Title
              </label>

              <input
                id="listing-title"
                name="title"
                type="text"
                maxlength="120"
                required
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm outline-none focus:border-ink"
              />

              <p id="title-count" class="mt-1 text-right text-xs text-muted">
                0/120
              </p>
            </div>

            <div class="mt-5">
              <label
                for="listing-description"
                class="block text-sm font-medium"
              >
                Description
              </label>

              <p class="mt-1 text-xs text-muted">
                Description of the item you are selling.
              </p>

              <textarea
                id="listing-description"
                name="description"
                rows="5"
                maxlength="500"
                required
                class="mt-2 w-full resize-y rounded-lg border border-divider bg-white px-3 py-3 text-sm outline-none focus:border-ink"
              ></textarea>

              <p
                id="description-count"
                class="mt-1 text-right text-xs text-muted"
              >
                0/500
              </p>
            </div>

            <div class="mt-5">
              <label for="listing-brand" class="block text-sm font-medium">
                Brand
              </label>

              <input
                id="listing-brand"
                name="brand"
                type="text"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              />
            </div>

            <div class="mt-5">
              <label for="listing-size" class="block text-sm font-medium">
                Size
              </label>

              <input
                id="listing-size"
                name="size"
                type="text"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              />
            </div>

            <div class="mt-5">
              <label for="listing-color" class="block text-sm font-medium">
                Color
              </label>

              <input
                id="listing-color"
                name="color"
                type="text"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              />
            </div>

            <div class="mt-5">
              <label for="listing-material" class="block text-sm font-medium">
                Material
              </label>

              <input
                id="listing-material"
                name="material"
                type="text"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              />
            </div>

            <div class="mt-5">
              <label for="listing-condition" class="block text-sm font-medium">
                State
              </label>

              <select
                id="listing-condition"
                name="condition"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              >
                <option value="">Select condition</option>

                <option value="new">New</option>

                <option value="excellent">Excellent</option>

                <option value="good">Good</option>

                <option value="used">Used</option>
              </select>
            </div>

            <div class="mt-5">
              <label for="listing-category" class="block text-sm font-medium">
                Category
              </label>

              <select
                id="listing-category"
                name="category"
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              >
                <option value="">Select category</option>

                <option value="womens-fashion">Women's fashion</option>

                <option value="mens-fashion">Men's fashion</option>

                <option value="electronics">Electronics</option>

                <option value="art-design">Art and design</option>

                <option value="other">Other</option>
              </select>
            </div>

            <!-- API-required deadline -->
            <div class="mt-7">
              <label for="listing-deadline" class="block text-sm font-medium">
                Auction deadline
              </label>

              <p class="mt-1 text-xs text-muted">
                Choose when the auction should end.
              </p>

              <input
                id="listing-deadline"
                name="deadline"
                type="datetime-local"
                required
                class="mt-2 min-h-11 w-full rounded-lg border border-divider bg-white px-3 text-sm"
              />
            </div>

            <p
              id="create-error"
              hidden
              class="mt-5 text-sm text-brand"
              role="alert"
            ></p>

            <!-- Preview first -->
            <button
              id="preview-listing"
              type="button"
              class="mt-8 min-h-11 w-full rounded-lg border border-ink bg-page px-4 text-sm font-medium"
            >
              Preview Listing
            </button>

            <button
              id="publish-listing"
              type="submit"
              class="mt-3 min-h-12 w-full rounded-lg bg-ink px-4 text-sm font-medium text-white disabled:opacity-60"
            >
              Publish Listing
            </button>

            <a
              href="./index.html"
              class="mt-3 flex min-h-11 items-center justify-center text-sm text-muted"
            >
              Cancel
            </a>
          </section>
        </form>

        <!-- Preview -->
        <section id="create-preview" hidden aria-labelledby="preview-heading">
          <div class="mb-4">
            <button
              id="back-to-create"
              type="button"
              class="min-h-11 text-sm text-muted"
            >
              ← Back to edit
            </button>
          </div>

          <h2 id="preview-heading" class="sr-only">Listing preview</h2>

          <div class="lg:grid lg:grid-cols-[480px_1fr] lg:gap-x-[68px]">
            <div
              class="aspect-square overflow-hidden rounded-xl bg-soft lg:h-[480px] lg:rounded-none"
            >
              <img
                id="preview-main-image"
                src=""
                alt=""
                class="h-full w-full object-cover"
              />
            </div>

            <div class="pt-4 lg:pt-0">
              <p id="preview-brand" class="text-xs text-muted"></p>

              <h2 id="preview-title" class="mt-1 text-xl font-medium"></h2>

              <p class="mt-5 text-xs text-muted">Description</p>

              <p
                id="preview-description"
                class="mt-2 whitespace-pre-line text-sm"
              ></p>

              <div id="preview-tags" class="mt-5 flex flex-wrap gap-2"></div>

              <button
                id="publish-from-preview"
                type="button"
                class="mt-8 min-h-12 w-full rounded-lg bg-ink text-sm font-medium text-white"
              >
                Publish Listing
              </button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <div data-auth-only hidden class="h-20 lg:hidden" aria-hidden="true"></div>

    <div id="mobile-bottom-nav"></div>

    <footer id="site-footer"></footer>

    <script type="module" src="./js/pages/createListing.js"></script>
  </body>
</html>
